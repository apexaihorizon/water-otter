{% extends "base.html" %}
{% block content %}
<div class="card" style="border-left: 5px solid #dc2626;">
    <div class="card-title">{{ error_title or '400 - Input Validation Error' }}</div>
    <p style="margin: 0.75rem 0; color: var(--text-secondary);">{{ error_message }}</p>
    {% if error_field %}<p><strong>Invalid Field:</strong> <code>{{ error_field }}</code></p>{% endif %}
    <div style="margin-top: 1rem;">
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Dashboard</a>
    </div>
</div>
{% endblock %}
